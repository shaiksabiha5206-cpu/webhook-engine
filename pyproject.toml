[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webhook-engine"
version = "0.1.0"
description = "my first fastapi project"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
    "httpx",
    "structlog",
]

[tool.setuptools.packages.find]
where = ["src"]